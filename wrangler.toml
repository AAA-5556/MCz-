name = "attendance-app"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# Cloudflare D1 binding. The code reads the database as `env.DB`.
# Create the DB, then paste the returned database_id below:
#   npx wrangler d1 create attendance-db
#   npx wrangler d1 execute attendance-db --file=./schema.sql
[[d1_databases]]
binding = "DB"
database_name = "attendance-db"
database_id = "66e1dc11-1d9f-4c39-ba61-b6624d767ad5"

# JWT secret used by verifyToken() once you swap in real verification.
# For local dev put it in .dev.vars; in prod set it as a Pages secret.
# [vars]
# JWT_SECRET = "set-me-in-.dev.vars-or-as-a-secret"
